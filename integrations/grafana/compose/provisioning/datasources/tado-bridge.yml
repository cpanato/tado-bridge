apiVersion: 1
datasources:
  - name: tado-bridge Prometheus
    uid: tado-bridge-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
  - name: tado-bridge History
    uid: tado-bridge-postgres
    type: grafana-postgresql-datasource
    access: proxy
    url: postgres:5432
    user: grafana_reader
    jsonData:
      database: tado_bridge
      sslmode: disable
      postgresVersion: 1800
      timescaledb: false
    secureJsonData:
      password: $GRAFANA_DB_PASSWORD
    editable: false
