apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tado-bridge-credentials
  namespace: tado-bridge-ci
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 16Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tado-fake
  namespace: tado-bridge-ci
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tado-fake
  template:
    metadata:
      labels:
        app: tado-fake
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: tado-fake
          image: ko.local:fixture
          imagePullPolicy: Never
          args: [serve]
          env:
            - name: BRIDGE_URL
              value: http://tado-bridge:8080
            - name: API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: tado-bridge-secrets
                  key: api-token
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: https
              containerPort: 8443
          readinessProbe:
            httpGet:
              path: /healthz
              port: https
              scheme: HTTPS
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: tls
              mountPath: /tls
              readOnly: true
            - name: state
              mountPath: /state
      volumes:
        - name: tls
          secret:
            secretName: tado-fixture-tls
        - name: state
          persistentVolumeClaim:
            claimName: tado-bridge-credentials
---
apiVersion: v1
kind: Service
metadata:
  name: tado-fake
  namespace: tado-bridge-ci
spec:
  type: ClusterIP
  selector:
    app: tado-fake
  ports:
    - name: https
      port: 443
      targetPort: https
