# Optional local history. Combine with compose.yaml; PostgreSQL has no host port.
services:
  tado-bridge:
    environment:
      HISTORY_DATABASE_URL: "postgres://tado_bridge:${HISTORY_POSTGRES_PASSWORD:?Set a URL-safe HISTORY_POSTGRES_PASSWORD}@postgres/tado_bridge?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - default
      - history

  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: tado_bridge
      POSTGRES_DB: tado_bridge
      POSTGRES_PASSWORD: "${HISTORY_POSTGRES_PASSWORD:?Set a URL-safe HISTORY_POSTGRES_PASSWORD}"
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U tado_bridge -d tado_bridge"]
      interval: 5s
      timeout: 3s
      retries: 10
    security_opt:
      - no-new-privileges:true
    volumes:
      - history-data:/var/lib/postgresql
    networks:
      - history
    stop_grace_period: 30s

networks:
  history:
    internal: true

volumes:
  history-data:
