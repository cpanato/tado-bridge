services:
  tado-bridge:
    image: "${TADO_BRIDGE_IMAGE:-ko.local/tado-bridge:local}"
    pull_policy: never
    command: [serve]
    healthcheck:
      test: [CMD, /ko-app/tado-bridge, healthcheck]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    user: "${TADO_BRIDGE_UID:-65532}:${TADO_BRIDGE_GID:-65532}"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:${TADO_BRIDGE_PORT:-8080}:8080"
    environment:
      LISTEN_ADDR: "0.0.0.0:8080"
      ALLOW_NETWORK_EXPOSURE: "true"
      API_TOKEN: "${API_TOKEN:?Set API_TOKEN before starting Compose}"
      TADO_CREDENTIALS_FILE: /var/lib/tado-bridge/credentials.json
      POLL_INTERVAL: "${POLL_INTERVAL:-30m}"
      MAX_SNAPSHOT_AGE: "${MAX_SNAPSHOT_AGE:-2h}"
      TADO_DAILY_REQUEST_BUDGET: "${TADO_DAILY_REQUEST_BUDGET:-90}"
      METRICS_ENABLED: "${METRICS_ENABLED:-false}"
      METRICS_ROOM_DETAILS: "${METRICS_ROOM_DETAILS:-false}"
      HISTORY_DATABASE_URL: "${HISTORY_DATABASE_URL:-}"
      HISTORY_RETENTION: "${HISTORY_RETENTION:-2160h}"
      TRMNL_ENABLED: "${TRMNL_ENABLED:-false}"
      TRMNL_WEBHOOK_URL: "${TRMNL_WEBHOOK_URL:-}"
      TRMNL_INTERVAL: "${TRMNL_INTERVAL:-30m}"
      TRMNL_ROOMS: "${TRMNL_ROOMS:-}"
    volumes:
      - type: bind
        source: "${TADO_CREDENTIALS_DIR:?Set TADO_CREDENTIALS_DIR to the existing private credentials directory}"
        target: /var/lib/tado-bridge
        bind:
          create_host_path: false
    stop_grace_period: 10s
